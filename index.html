<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GiftMe</title>
<style>
  :root {
    --bg: #fdf6f0;
    --card: #ffffff;
    --accent: #e0507a;
    --accent-dark: #b8395f;
    --text: #2b2320;
    --muted: #7a6f68;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 48px 40px;
    max-width: 440px;
    width: 100%;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,0.08);
  }
  .icon { font-size: 48px; margin-bottom: 8px; }
  h1 {
    margin: 0 0 8px;
    font-size: 2rem;
    color: var(--accent-dark);
  }
  p.tagline {
    margin: 0 0 32px;
    color: var(--muted);
    font-size: 1rem;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 14px 28px;
    border-radius: 999px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.1s ease;
  }
  button:hover { background: var(--accent-dark); }
  button:active { transform: scale(0.97); }
  footer {
    margin-top: 28px;
    font-size: 0.8rem;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🎁</div>
    <h1>GiftMe</h1>
    <p class="tagline">Find the perfect gift, every time.</p>
    <button onclick="alert('More coming soon!')">Get Started</button>
    <footer>Made with care 💌</footer>
  </div>
</body>
</html>
